name: Chomugiri build & release

# Builds and signs the Chomugiri APK entirely in CI, from the keystore kept as repo secrets — the keystore
# itself never has to pass through an ephemeral dev session or sit on a laptop to get a release out.
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   CHOMUGIRI_KEYSTORE_BASE64  — `base64 -w0 chomugiri-release.keystore`
#   CHOMUGIRI_KEYSTORE_PASSWORD — the keystore/key password (same string for both, alias "chomugiri")
# Without those two secrets set the build still runs and produces an unsigned APK (uploaded as a workflow
# artifact only, never published as a release) — deliberate, so a release is never silently unsigned.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/chomugiri-workspace-design-09sxwa
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/chomugiri-build-release.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # android-actions/setup-android@v3 shells out to `sdkmanager tools`, a package Google dropped
      # from the repository years ago — it now fails outright on every runner. Installing only the three
      # packages the build actually needs sidesteps it.
      - name: Install the Android SDK pieces this build needs
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # No gradlew wrapper is committed; this installs a real Gradle (RELEASE.md's local flow uses the
      # same system `gradle`) and exposes it as `gradle` on PATH.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Install dependencies
        run: npm ci

      - name: Test and typecheck
        run: |
          npm test
          npx tsc --noEmit

      - name: Build the static export for the Android shell
        run: |
          npm run build
          node scripts/export-static.mjs

      - name: Give this build a higher version number than the last
        # Android refuses to install an update whose versionCode is not strictly higher than the installed one.
        run: |
          sed -i "s/versionCode = [0-9]*/versionCode = $((1000 + GITHUB_RUN_NUMBER))/" android/app/build.gradle.kts
          grep -n "versionCode\|versionName" android/app/build.gradle.kts

      - name: Decode the signing keystore
        id: sign
        env:
          KS_B64: ${{ secrets.CHOMUGIRI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No CHOMUGIRI_KEYSTORE_BASE64 secret set — building unsigned."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/chomugiri-release.keystore"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Assemble the release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CHOMUGIRI_KEYSTORE_PASSWORD }}
        run: |
          if [ "${{ steps.sign.outputs.has_keystore }}" = "true" ]; then
            gradle assembleRelease \
              -PCHOMUGIRI_KEYSTORE="$RUNNER_TEMP/chomugiri-release.keystore" \
              -PCHOMUGIRI_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
              -PCHOMUGIRI_KEY_ALIAS=chomugiri \
              -PCHOMUGIRI_KEY_PASSWORD="$KEYSTORE_PASSWORD"
          else
            gradle assembleRelease
          fi

      - name: Read the version from the project
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Upload the APK as a workflow artifact (always, signed or not)
        uses: actions/upload-artifact@v4
        with:
          name: Chomugiri-${{ steps.ver.outputs.name }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish the signed download release
        if: steps.sign.outputs.has_keystore == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chomugiri-latest
          name: Chomugiri v${{ steps.ver.outputs.name }} (latest)
          body: |
            Signed Chomugiri APK, version ${{ steps.ver.outputs.name }}, built from ${{ github.sha }}.
            Installs over the previous version signed with the same key. Enable "install from unknown
            sources" to sideload.
          files: android/app/build/outputs/apk/release/*.apk
