name: Crimson Mist APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/chomugiri-workspace-design-09sxwa
    paths:
      - "examples/crimson-mist/**"
      - "examples/sideload.keystore"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    # GitHub Actions forces HOME=/github/home inside a `container:` job,
    # which shadows this image's baked-in export templates and Java SDK
    # config (both live under /root in the image). Point HOME back at
    # /root so Godot finds what the image already shipped.
    env:
      HOME: /root
    defaults:
      run:
        working-directory: examples/crimson-mist
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the image's export templates
        run: |
          echo "HOME=$HOME"
          find / -maxdepth 6 -iname "android_release.apk" 2>/dev/null || true
          ls -la /root/.local/share/godot/export_templates/ 2>/dev/null || true

      - name: Give this build a higher version number than the last
        # Android refuses to install a build over a newer one, so the number must only ever go up.
        run: |
          sed -i "s/^version\/code=.*/version\/code=$((1000 + GITHUB_RUN_NUMBER))/" export_presets.cfg
          grep -n "^version/" export_presets.cfg

      - name: Import project
        run: godot --headless --import || true

      - name: Run every test gate
        run: |
          chmod +x tests/run_all.sh
          tests/run_all.sh godot

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/examples/sideload.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: chomugames
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: chomugames
        run: |
          mkdir -pv build
          godot --headless --export-release "Android" build/CrimsonMist.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrimsonMist-apk
          path: examples/crimson-mist/build/CrimsonMist.apk
          retention-days: 60

      - name: Publish a download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: crimson-mist-apk
          name: Crimson Mist (latest build)
          body: Auto-built from ${{ github.sha }}. Sideload APK — enable "install from unknown sources" to install.
          files: examples/crimson-mist/build/CrimsonMist.apk
