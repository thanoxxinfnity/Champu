name: Station Nine APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/chomugiri-workspace-design-09sxwa
    paths:
      - "examples/station-nine/**"
      - "examples/sideload.keystore"
      - ".github/workflows/station-nine-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    # GitHub Actions forces HOME=/github/home inside a `container:` job, which hides this image's
    # baked-in export templates and Java SDK config (both live under /root). Point HOME back.
    env:
      HOME: /root
    defaults:
      run:
        working-directory: examples/station-nine
    steps:
      - uses: actions/checkout@v4

      - name: Import the project
        run: godot --headless --import || true

      # The game is only built if it can actually be finished. These are the same checks that were run
      # while it was made: every puzzle has one answer, the map is not broken, the creature behaves, and
      # a bot plays from the airlock to the escape pod with the real controls.
      - name: Puzzles have exactly one answer
        run: godot --headless -s tests/puzzles_test.gd
      - name: The map is not broken
        run: godot --headless -s tests/map_test.gd
      - name: The Hollow behaves
        run: godot --headless --fixed-fps 60 -s tests/hollow_test.gd
      - name: A bot plays the whole game
        run: godot --headless --fixed-fps 60 -s tests/playthrough.gd

      - name: Give this build a higher version number than the last
        run: |
          sed -i "s/^version\/code=.*/version\/code=$((1000 + GITHUB_RUN_NUMBER))/" export_presets.cfg
          grep -n "^version/" export_presets.cfg

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/examples/sideload.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: chomugames
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: chomugames
        run: |
          mkdir -pv build
          godot --headless --export-release "Android" build/StationNine.apk
          ls -la build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StationNine-apk
          path: examples/station-nine/build/StationNine.apk
          retention-days: 60

      - name: Publish a download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: station-nine-apk
          name: Station Nine (latest build)
          body: Auto-built from ${{ github.sha }}. Sideload APK — enable "install from unknown sources" to install.
          files: examples/station-nine/build/StationNine.apk
