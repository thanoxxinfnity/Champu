name: Chomugiri APK release

# The APK is signed with a keystore that is deliberately not in git or CI, so it is
# built locally (RELEASE.md) and committed to releases/. This only publishes it.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/chomugiri-workspace-design-09sxwa
    paths:
      - "releases/Chomugiri.apk"
      - "releases/Chomugiri-alt.apk"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the project
        id: ver
        run: |
          echo "name=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          ls -la releases/Chomugiri.apk
          echo "sha=$(sha256sum releases/Chomugiri.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          if [ -f releases/Chomugiri-alt.apk ]; then echo "alt=$(sha256sum releases/Chomugiri-alt.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"; fi

      - name: Write the release notes
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          **Install `Chomugiri.apk` — that is the real app** (version ${{ steps.ver.outputs.name }}, built from ${{ github.sha }}).
          It updates an existing Chomugiri in place (same signing key). Enable "install from unknown sources" to sideload.
          SHA-256: `${{ steps.ver.outputs.sha }}` — compare it after downloading; a cut-off download shows as "App not installed".

          `Chomugiri-alt.apk` is a **spare (ignore it unless needed)**, only for when Chomugiri.apk refuses to install: the same app under another
          package id (`com.chomugiri.workspace.v2`, shown as "Chomugiri v2"). It is a separate app and does not share chats with the real one.
          SHA-256: `${{ steps.ver.outputs.alt }}`
          NOTES
          sed -i 's/^          //' "$RUNNER_TEMP/notes.md"

      - name: Publish a download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chomugiri-latest
          name: Chomugiri v${{ steps.ver.outputs.name }} (latest)
          body_path: ${{ runner.temp }}/notes.md
          files: releases/Chomugiri.apk

      - name: Attach the spare APK to the same release
        if: ${{ steps.ver.outputs.alt != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chomugiri-latest
          name: Chomugiri v${{ steps.ver.outputs.name }} (latest)
          body_path: ${{ runner.temp }}/notes.md
          files: releases/Chomugiri-alt.apk
