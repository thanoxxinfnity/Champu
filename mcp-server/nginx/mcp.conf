# Reverse proxy for the Chomugiri MCP server. TLS terminates here; the app itself only ever
# speaks plain HTTP on the private network between nginx and the container/process.
#
# Key points for MCP's Streamable HTTP transport specifically:
#  - proxy_buffering off / chunked_transfer_encoding — this server replies with complete JSON
#    (enableJsonResponse: true in src/transport/http.ts), but turning buffering off is still the
#    right default for any MCP deployment, since a client is free to open a long-lived SSE GET
#    on /mcp for server-initiated notifications, and a buffering proxy would hold that open stream
#    until some buffer fills or the connection ends — defeating the stream entirely.
#  - proxy_read_timeout raised well past nginx's 60s default, for the same reason.
#  - the mcp-session-id and last-event-id headers must pass through untouched in both directions.

upstream chomugiri_mcp {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    server_name mcp.yourdomain.com;
    # ACME HTTP-01 challenge path for certbot/Let's Encrypt; everything else redirects to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name mcp.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # A bearer token in the Authorization header is the only credential this server accepts; make
    # sure it never gets logged in access logs (default combined log format omits request headers,
    # but double-check any custom log_format here before changing it).
    client_max_body_size 2m;

    location /healthz {
        proxy_pass http://chomugiri_mcp;
        access_log off;
    }

    location / {
        proxy_pass http://chomugiri_mcp;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Required for Streamable HTTP's session routing and resumable SSE streams.
        proxy_set_header mcp-session-id $http_mcp_session_id;
        proxy_set_header last-event-id $http_last_event_id;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
